name: build-container

on:
  workflow_dispatch:
    inputs:
      release:
        required: true
        default: "26.04"
        type: choice
        options: ["26.04", "24.04"]
      publish:
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "11 2 * * 1"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ inputs.release || '26.04' }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.release || '26.04' }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check container build prerequisites
        run: |
          docker info --format 'Docker server: {{.ServerVersion}}'
          docker buildx inspect --bootstrap
      - name: Login to GHCR
        if: inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        env:
          PUBLISH: ${{ inputs.publish == true && '1' || '0' }}
        run: make build-container
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate SBOM
        run: syft "${IMAGE_NAME}" -o spdx-json > "sbom-${{ matrix.arch }}.spdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: container-sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.spdx.json
