name: upstream-monitor

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      refresh_issue:
        description: Refresh the open tracking issue with current evidence
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate configured upstream release metadata
        run: |
          mkdir -p artifacts/upstream
          ruby scripts/monitor/check_upstream.rb \
            --output artifacts/upstream/report.json \
            --state artifacts/upstream/state.sha256
      - name: Check whether metadata is new
        id: upstream-cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/upstream/state.sha256
          key: ubuntu-upstream-metadata-${{ hashFiles('artifacts/upstream/state.sha256') }}
          lookup-only: true
      - name: Create or refresh tracking issue when metadata changes
        if: steps.upstream-cache.outputs.cache-hit != 'true' || inputs.refresh_issue == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/monitor/reconcile_issue.py \
            --repository "$GITHUB_REPOSITORY" \
            --title 'Upstream image metadata review' \
            --body-file artifacts/upstream/report.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Save current metadata state
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/upstream/state.sha256
          key: ubuntu-upstream-metadata-${{ hashFiles('artifacts/upstream/state.sha256') }}
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-metadata-${{ github.run_id }}
          path: artifacts/upstream
          retention-days: 14
