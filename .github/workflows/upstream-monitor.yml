name: upstream-monitor

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate configured upstream release metadata
        run: |
          mkdir -p artifacts/upstream
          ruby scripts/monitor/check_upstream.rb \
            --output artifacts/upstream/report.json \
            --state artifacts/upstream/state.sha256
      - name: Check whether metadata is new
        id: upstream-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/upstream/state.sha256
          key: ubuntu-upstream-metadata-${{ hashFiles('artifacts/upstream/state.sha256') }}
          lookup-only: true
      - name: Open duplicate-safe tracking issue when metadata changes
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --json title --jq '.[].title' | grep -qxF 'Upstream image metadata review' || \
            gh issue create --title 'Upstream image metadata review' --body-file artifacts/upstream/report.md
      - name: Save current metadata state
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/upstream/state.sha256
          key: ubuntu-upstream-metadata-${{ hashFiles('artifacts/upstream/state.sha256') }}
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-metadata-${{ github.run_id }}
          path: artifacts/upstream
          retention-days: 14
