name: release

on:
  workflow_dispatch:
    inputs:
      release:
        required: true
        default: "26.04"
        type: choice
        options: ["26.04", "24.04"]
      channel:
        required: true
        default: candidate
        type: choice
        options: [development, candidate, stable]

concurrency:
  group: release-${{ inputs.release }}-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=ubuntu-${{ inputs.release }}-${{ inputs.channel }}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Validate before promotion
        run: make validate test

  container:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable container tag
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}:${{ needs.gate.outputs.tag }} \
          PUBLISH=1 RELEASE=${{ inputs.release }} ARCH=amd64 make build-container
      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:${{ needs.gate.outputs.tag }}
          artifact-name: container-${{ needs.gate.outputs.tag }}.spdx.json
          output-file: container-${{ needs.gate.outputs.tag }}.spdx.json
          format: spdx-json
      - name: Scan container
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.gate.outputs.tag }}
          format: json
          output: container-${{ needs.gate.outputs.tag }}.trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image by digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ghcr.io/${{ github.repository }}:${{ needs.gate.outputs.tag }}

  release-assets:
    needs: gate
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ inputs.release }}
      ARCH: amd64
      AUTOINSTALL_PASSWORD_HASH: ${{ secrets.AUTOINSTALL_PASSWORD_HASH }}
      AUTOINSTALL_SSH_PUBLIC_KEY: ${{ secrets.AUTOINSTALL_SSH_PUBLIC_KEY }}
      AUTOINSTALL_SSH_PRIVATE_KEY: ${{ secrets.AUTOINSTALL_SSH_PRIVATE_KEY }}
      AUTOINSTALL_TARGET_DISK_SERIAL: CI-RELEASE-DISK
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: latest
      - name: Materialize ephemeral SSH key file
        run: |
          umask 077
          printf '%s\n' "$AUTOINSTALL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/factory_id_ed25519"
          echo "AUTOINSTALL_SSH_PRIVATE_KEY_FILE=$RUNNER_TEMP/factory_id_ed25519" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-utils xorriso
      - run: make build-vm FORMAT=qcow2
      - run: make build-vm FORMAT=raw
      - run: make build-iso PROFILE=hardened
      - name: Boot-test VM artifact
        run: make test-vm IMAGE="build/vm/ubuntu-${RELEASE}-${ARCH}.qcow2"
      - name: Generate manifest and metadata
        run: |
          mkdir -p artifacts/release
          cp build/vm/*.{qcow2,raw} build/iso/*.iso artifacts/release/ 2>/dev/null || true
          for artifact in artifacts/release/*; do
            case "$artifact" in
              *.qcow2) type=qcow2 ;;
              *.raw) type=raw ;;
              *.iso) type=iso ;;
              *) continue ;;
            esac
            python3 scripts/release/generate-metadata.py --artifact "$artifact" --release "$RELEASE" --architecture "$ARCH" --type "$type" --output "$artifact.metadata.json"
          done
          python3 scripts/release/manifest.py --input artifacts/release --output artifacts/release/manifest.json
      - name: Generate filesystem SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts/release
          artifact-name: release-${{ needs.gate.outputs.tag }}.spdx.json
          output-file: artifacts/release/release.spdx.json
          format: spdx-json
      - name: Scan release files
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: artifacts/release
          format: json
          output: artifacts/release/release.trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
      - name: Refresh metadata after security gate
        env:
          SECURITY_SCAN_STATUS: passed
        run: |
          for artifact in artifacts/release/*; do
            case "$artifact" in
              *.qcow2) type=qcow2 ;;
              *.raw) type=raw ;;
              *.iso) type=iso ;;
              *) continue ;;
            esac
            python3 scripts/release/generate-metadata.py --artifact "$artifact" --release "$RELEASE" --architecture "$ARCH" --type "$type" --output "$artifact.metadata.json"
          done
          python3 scripts/release/manifest.py --input artifacts/release --output artifacts/release/manifest.json
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign release manifest
        run: cosign sign-blob --yes --output-signature artifacts/release/manifest.sig artifacts/release/manifest.json
      - name: Attest release manifest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/manifest.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          prerelease: ${{ inputs.channel != 'stable' }}
          files: artifacts/release/*
