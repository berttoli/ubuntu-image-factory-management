name: build-vm

on:
  workflow_dispatch:
    inputs:
      release:
        required: true
        default: "26.04"
        type: choice
        options: ["26.04", "24.04"]
      architecture:
        required: true
        default: amd64
        type: choice
        options: [amd64, arm64]
  schedule:
    - cron: "23 1 * * 1"
  pull_request:
    paths:
      - packer/**
      - autoinstall/**
      - ansible/**
      - scripts/build/**
      - scripts/test/**
      - scripts/autoinstall/**
      - .github/workflows/build-vm.yml

concurrency:
  group: build-vm-${{ github.ref }}-${{ inputs.release || 'default' }}-${{ inputs.architecture || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE: ${{ inputs.release || '26.04' }}
      ARCH: ${{ inputs.architecture || 'amd64' }}
      # Throwaway credentials are generated for each build and removed from the image
      # before it is captured, so no repository secret is needed and none ends up in
      # a published image.
      AUTOINSTALL_EPHEMERAL_CREDENTIALS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: latest
      - name: Install QEMU and ISO dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-utils xorriso p7zip-full cloud-image-utils openssl zstd
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build QCOW2
        run: make build-vm FORMAT=qcow2
      - name: Build RAW
        run: make build-vm FORMAT=raw
      - name: Acceptance test
        env:
          TEST_EVIDENCE_DIR: ${{ runner.temp }}/vm-evidence
        run: make test-vm IMAGE="build/vm/ubuntu-${RELEASE}-${ARCH}.qcow2"
      - name: Compress RAW for upload
        run: |
          zstd -q -T0 --rm "build/vm/ubuntu-${RELEASE}-${ARCH}.raw"
          ls -la build/vm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-evidence-${{ env.RELEASE }}-${{ env.ARCH }}
          path: ${{ runner.temp }}/vm-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: vm-${{ env.RELEASE }}-${{ env.ARCH }}
          path: build/vm
          retention-days: 14
