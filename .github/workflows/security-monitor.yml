name: security-monitor

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      refresh_issue:
        description: Refresh the open tracking issue with current feed digests
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: security-monitor
  cancel-in-progress: false

jobs:
  ubuntu-security-feed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Ubuntu OVAL feeds
        run: |
          mkdir -p artifacts/security-monitor
          curl --fail --location --silent --show-error https://security-metadata.canonical.com/oval/com.ubuntu.noble.cve.oval.xml.bz2 -o artifacts/security-monitor/noble.oval.xml.bz2
          curl --fail --location --silent --show-error https://security-metadata.canonical.com/oval/com.ubuntu.resolute.cve.oval.xml.bz2 -o artifacts/security-monitor/resolute.oval.xml.bz2
      - name: Record feed checksum
        run: sha256sum artifacts/security-monitor/*.oval.xml.bz2 | sort > artifacts/security-monitor/SHA256SUMS
      - name: Check whether the feed is new
        id: feed-cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/security-monitor/SHA256SUMS
          key: ubuntu-security-feed-${{ hashFiles('artifacts/security-monitor/SHA256SUMS') }}
          lookup-only: true
      - name: Check VM build credential availability
        if: steps.feed-cache.outputs.cache-hit != 'true'
        id: vm-credentials
        env:
          AUTOINSTALL_PASSWORD_HASH: ${{ secrets.AUTOINSTALL_PASSWORD_HASH }}
          AUTOINSTALL_SSH_PUBLIC_KEY: ${{ secrets.AUTOINSTALL_SSH_PUBLIC_KEY }}
          AUTOINSTALL_SSH_PRIVATE_KEY: ${{ secrets.AUTOINSTALL_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUTOINSTALL_PASSWORD_HASH" && -n "$AUTOINSTALL_SSH_PUBLIC_KEY" && -n "$AUTOINSTALL_SSH_PRIVATE_KEY" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'VM candidate dispatch deferred: configure the three AUTOINSTALL repository secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Trigger container candidate rebuilds when the feed changes
        if: steps.feed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for release in 26.04 24.04; do
            gh workflow run build-container.yml --ref "${GITHUB_REF_NAME}" -f release="$release" -f publish=false
          done
      - name: Trigger VM candidate rebuilds when credentials are available
        if: steps.feed-cache.outputs.cache-hit != 'true' && steps.vm-credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for release in 26.04 24.04; do
            gh workflow run build-vm.yml --ref "${GITHUB_REF_NAME}" -f release="$release" -f architecture=amd64
          done
      - name: Explain current security feed state
        if: steps.feed-cache.outputs.cache-hit != 'true' || inputs.refresh_issue == true
        env:
          FEED_CHANGED: ${{ steps.feed-cache.outputs.cache-hit != 'true' }}
          VM_REBUILD_REQUESTED: ${{ steps.feed-cache.outputs.cache-hit != 'true' && steps.vm-credentials.outputs.ready == 'true' }}
        run: python3 scripts/monitor/security_report.py artifacts/security-monitor/SHA256SUMS artifacts/security-monitor/report.md
      - name: Create or refresh security feed issue
        if: steps.feed-cache.outputs.cache-hit != 'true' || inputs.refresh_issue == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/monitor/reconcile_issue.py \
            --repository "$GITHUB_REPOSITORY" \
            --title 'Ubuntu security feed changed' \
            --body-file artifacts/security-monitor/report.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Save current feed state
        if: steps.feed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: artifacts/security-monitor/SHA256SUMS
          key: ubuntu-security-feed-${{ hashFiles('artifacts/security-monitor/SHA256SUMS') }}
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-security-feed-${{ github.run_id }}
          path: artifacts/security-monitor
          retention-days: 14
